name: Build Windows exe
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Self-test before building
        run: python tally_suite.py --selftest
      - run: pyinstaller --onefile --windowed --name TallyCASuite tally_suite.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: dist/TallyCASuite.exe
